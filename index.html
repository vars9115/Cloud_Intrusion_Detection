<!DOCTYPE html>
<html>
<head>
    <title>Cloud Intrusion Detection</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Cloud-Based Intrusion Detection</h1>

    <label>Packet Count</label>
    <input type="number" id="packet_count" placeholder="Enter packet count">

    <label>Failed Login Attempts</label>
    <input type="number" id="failed_logins" placeholder="Enter failed logins">

    <label>Port Number</label>
    <input type="number" id="port" placeholder="Enter port number">

    <button onclick="detectIntrusion()">Check Network</button>

    <div id="result"></div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
